<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">Compound V3 Comet 资产模型</title>
  <desc id="desc">展示 Chain、Comet、base asset、collateral assets、price feeds、rewards contract 和用户读取方法之间的关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#64748b"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #dbe4ef; stroke-width: 1.2; rx: 12; filter: url(#shadow); }
      .band { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.2; rx: 10; }
      .box { stroke-width: 1.7; rx: 9; }
      .chain { fill: #eff6ff; stroke: #60a5fa; }
      .comet { fill: #f5f3ff; stroke: #a78bfa; }
      .base { fill: #ecfdf5; stroke: #34d399; }
      .collateral { fill: #fff7ed; stroke: #fb923c; }
      .oracle { fill: #eef2ff; stroke: #818cf8; }
      .reward { fill: #fefce8; stroke: #eab308; }
      .user { fill: #f0fdfa; stroke: #14b8a6; }
      .note-box { fill: #f8fafc; stroke: #cbd5e1; }
      .line { stroke: #64748b; stroke-width: 1.8; fill: none; }
      .soft { stroke: #94a3b8; }
      .dash { stroke-dasharray: 7 6; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 30px; font-weight: 700; fill: #172033; letter-spacing: 0; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; fill: #53647c; letter-spacing: 0; }
      .band-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 700; fill: #334155; letter-spacing: 0; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 700; fill: #111827; letter-spacing: 0; }
      .node-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12.5px; fill: #53647c; letter-spacing: 0; }
      .small { font-size: 11.5px; fill: #64748b; }
      .call { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #475569; }
      .badge { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 14; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 600; fill: #475569; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1240" height="760"/>
  <rect class="panel" x="28" y="24" width="1184" height="708"/>

  <text class="title" x="70" y="76">Compound V3 Comet 资产模型</text>
  <text class="subtitle" x="70" y="104">一个 Comet 只围绕一个 base asset 展开；collateral asset 只用于借款能力和清算风险。</text>

  <rect class="band" x="70" y="142" width="1080" height="122"/>
  <text class="band-title" x="96" y="174">链与市场</text>

  <rect class="box chain" x="108" y="194" width="204" height="52"/>
  <text class="node-title" x="210" y="216" text-anchor="middle">Chain</text>
  <text class="node-note" x="210" y="237" text-anchor="middle">Ethereum / Arbitrum / Base</text>

  <rect class="box comet" x="438" y="182" width="300" height="76"/>
  <text class="node-title" x="588" y="210" text-anchor="middle">Comet Market</text>
  <text class="node-note" x="588" y="232" text-anchor="middle">Comet proxy + market parameters</text>
  <text class="call" x="588" y="250" text-anchor="middle">market.address</text>

  <rect class="box note-box" x="872" y="190" width="232" height="58"/>
  <text class="node-title" x="988" y="215" text-anchor="middle">项目视角</text>
  <text class="node-note" x="988" y="236" text-anchor="middle">一个 Comet 拆成 yield / lending</text>

  <path class="line" marker-end="url(#arrow)" d="M312 220 H438"/>
  <path class="line soft" marker-end="url(#arrow-soft)" d="M738 220 H872"/>

  <rect class="band" x="70" y="302" width="1080" height="292"/>
  <text class="band-title" x="96" y="334">Comet 内部资产与外部依赖</text>

  <rect class="box base" x="106" y="378" width="248" height="126"/>
  <text class="node-title" x="230" y="408" text-anchor="middle">Base Asset</text>
  <text class="node-note" x="230" y="431" text-anchor="middle">唯一可供应并产生利息的资产</text>
  <text class="node-note" x="230" y="452" text-anchor="middle">也是唯一可借入的债务资产</text>
  <rect class="badge" x="147" y="470" width="166" height="24"/>
  <text class="badge-text" x="230" y="487" text-anchor="middle">USDC / USDT / WETH ...</text>

  <rect class="box collateral" x="440" y="360" width="260" height="164"/>
  <text class="node-title" x="570" y="390" text-anchor="middle">Collateral Assets</text>
  <text class="node-note" x="570" y="414" text-anchor="middle">只记录抵押余额</text>
  <text class="node-note" x="570" y="435" text-anchor="middle">不产生 base supply 利息</text>
  <text class="call" x="570" y="463" text-anchor="middle">collateralBalanceOf(owner, asset)</text>
  <text class="call" x="570" y="484" text-anchor="middle">borrowCollateralFactor</text>
  <text class="call" x="570" y="505" text-anchor="middle">liquidateCollateralFactor</text>

  <rect class="box oracle" x="786" y="352" width="252" height="112"/>
  <text class="node-title" x="912" y="382" text-anchor="middle">Price Feeds</text>
  <text class="node-note" x="912" y="405" text-anchor="middle">base feed + collateral feeds</text>
  <text class="node-note" x="912" y="426" text-anchor="middle">用于风险字段和健康度计算</text>
  <text class="call" x="912" y="448" text-anchor="middle">Comet.getPrice(priceFeed)</text>

  <rect class="box reward" x="786" y="496" width="252" height="82"/>
  <text class="node-title" x="912" y="526" text-anchor="middle">Rewards Contract</text>
  <text class="node-note" x="912" y="549" text-anchor="middle">读取可领取 reward token</text>
  <text class="call" x="912" y="570" text-anchor="middle">getRewardOwed(comet, owner)</text>

  <path class="line" marker-end="url(#arrow)" d="M588 258 V306 H230 V378"/>
  <path class="line" marker-end="url(#arrow)" d="M588 258 V360"/>
  <path class="line" marker-end="url(#arrow)" d="M588 306 H912 V352"/>
  <path class="line soft" marker-end="url(#arrow-soft)" d="M700 442 H786"/>
  <path class="line soft" marker-end="url(#arrow-soft)" d="M700 480 H740 V537 H786"/>

  <rect class="band" x="70" y="620" width="1080" height="82"/>
  <text class="band-title" x="96" y="650">用户读取入口</text>

  <rect class="box user" x="132" y="664" width="222" height="36"/>
  <text class="call" x="243" y="686" text-anchor="middle">balanceOf(owner)</text>

  <rect class="box user" x="416" y="664" width="252" height="36"/>
  <text class="call" x="542" y="686" text-anchor="middle">borrowBalanceOf(owner)</text>

  <rect class="box user" x="730" y="664" width="306" height="36"/>
  <text class="call" x="883" y="686" text-anchor="middle">isBorrowCollateralized / isLiquidatable</text>

  <path class="line dash" marker-end="url(#arrow-soft)" d="M243 664 V526 H230 V504"/>
  <path class="line dash" marker-end="url(#arrow-soft)" d="M542 664 V548 H230 V504"/>
  <path class="line dash" marker-end="url(#arrow-soft)" d="M883 664 V594 H570 V524"/>
</svg>
