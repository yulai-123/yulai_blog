# Template for /etc/nginx/sites-available/yulai.org on the Tokyo VPS.
# Adjust certificate paths before enabling.

server {
    listen 80;
    listen [::]:80;
    server_name yulai.org blog.yulai.org;

    include /etc/nginx/snippets/cloudflare-only.conf;
    return 301 https://yulai.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blog.yulai.org;

    include /etc/nginx/snippets/cloudflare-only.conf;
    ssl_certificate /etc/ssl/cloudflare/yulai.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/yulai.org.key;

    return 301 https://yulai.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yulai.org;

    include /etc/nginx/snippets/cloudflare-only.conf;
    ssl_certificate /etc/ssl/cloudflare/yulai.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/yulai.org.key;

    root /srv/yulai_blog/public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
